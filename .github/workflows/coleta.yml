name: coleta-diaria

on:
  schedule:
    # Várias janelas (ADR-008, revisão 1). O TCGCSV atualiza por volta de 20h05 UTC (17h05 em Brasília).
    # O GitHub atrasa execuções agendadas em horas (observado: de 3h30 a 6h30). Cada janela é atrasada de forma
    # independente, então quanto mais cedo e mais numerosas, maior a chance de uma cair antes da meia-noite BRT.
    # A coleta é idempotente: se uma janela deu certo, as demais não gravam nada.
    - cron: "10 20 * * *"   # 17:10 BRT
    - cron: "25 20 * * *"   # 17:25 BRT
    - cron: "40 20 * * *"   # 17:40 BRT
    - cron: "10 21 * * *"   # 18:10 BRT
    - cron: "40 21 * * *"   # 18:40 BRT
    - cron: "10 22 * * *"   # 19:10 BRT
  workflow_dispatch:
    inputs:
      allow_stale:
        description: "Gravar mesmo que o TCGCSV ainda não tenha atualizado (use só se souber o que está fazendo)"
        type: boolean
        default: false

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Coleta + silver + gold + carteira
        env:
          POKELAKE_BACKEND: s3
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: tcg
          COLECAO_SIGLA: ${{ vars.COLECAO_SIGLA }}
          RESPONSAVEL: ${{ vars.RESPONSAVEL }}
          TAXA_VENDA: "0.15"
        run: |
          if [ "${{ inputs.allow_stale }}" = "true" ]; then
            python -m pokelake daily --allow-stale
          else
            python -m pokelake daily
          fi
