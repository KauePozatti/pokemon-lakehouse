name: coleta-diaria

on:
  schedule:
    # 21:30 UTC = 18:30 em Brasília: depois da atualização do TCGCSV (~20h UTC) e da PTAX de fechamento (~13h BRT).
    # O GitHub pode atrasar execuções agendadas em alguns minutos; a coleta é idempotente, então é seguro reexecutar.
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      allow_stale:
        description: "Gravar mesmo que o TCGCSV ainda não tenha atualizado (use só se souber o que está fazendo)"
        type: boolean
        default: false

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Coleta + silver + gold + carteira
        env:
          POKELAKE_BACKEND: s3
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: tcg
          COLECAO_SIGLA: ${{ vars.COLECAO_SIGLA }}
          RESPONSAVEL: ${{ vars.RESPONSAVEL }}
          TAXA_VENDA: "0.15"
        run: |
          if [ "${{ inputs.allow_stale }}" = "true" ]; then
            python -m pokelake daily --allow-stale
          else
            python -m pokelake daily
          fi
