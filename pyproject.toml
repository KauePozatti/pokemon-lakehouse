[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokelake"
version = "0.1.0"
description = "Pipeline de dados de cartas Pokémon como ativo de coleção (MBA Engenharia de Dados)"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34",
  "requests>=2.31",
  "pydantic>=2.5",
  "pyarrow>=15",
  "pandas>=2.1",
  "numpy>=1.26",
  "duckdb>=1.1",
  "streamlit>=1.50",
  "plotly>=5.20",
  "python-dotenv>=1.0",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
